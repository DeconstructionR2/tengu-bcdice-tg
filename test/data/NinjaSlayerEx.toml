#   - **暗骰（S 前缀）可用**：1版 14 个前缀两两无遮蔽，`SOUL` / `SUMMON` 不受
#     `(S)?` 回溯影响。本块含 `SSOUL` / `SBK` / `SBIOCYBER` / `SWS` 四条
#     暗骰用例，作为 prefixes_pattern 覆写的回归钉。
#   - 親类命令（NJ / EV / AT / EL / SB）**零改动**，
#     由本文件上方的父类孪生用例钉死。
# ---------------------------------------------------------------------------

