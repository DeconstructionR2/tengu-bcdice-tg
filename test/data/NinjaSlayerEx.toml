# DKKI 1D6 掷骰｜出目 1（可达域下界）
[[ test ]]
game_system = "NinjaSlayerEx"
input = "DKKI"
output = "暗黒カラテ衝動_1(1) ＞ **破壊衝動：**\nこのニンジャは残虐な暴力衝動や殺戮衝動に呑まれやすくなったり、思考回路から人間性が失われてゆく。シナリオ内で【DKK】を獲得できるようなシチュエーションが目の前にある場合、可能な限りそれを得るような行動を取らねばならない。行動を強いられたくない場合、【精神力】を１消費すれば、このマップにいる間だけこの衝動を克服する。アーチ級ソウル憑依者の場合は【精神力】を１ではなく２消費する必要がある。"
rands = [
  { sides = 6, value = 1 },
]

# DKKI 1D6 掷骰｜出目 3（中点）
[[ test ]]
game_system = "NinjaSlayerEx"
input = "DKKI"
output = "暗黒カラテ衝動_1(3) ＞ **徹底抗戦：**\n極めて傲慢かつ自尊心が高いため、自分を挑発したり傷つけてきた敵の存在を許さない。たとえそれがネオサイタマの死神であろうとも。ダメージを受けたかどうかに関わらず敵から攻撃を受けた場合、ないしは露骨な挑発や侮辱を受けた場合、その敵が死ぬまで自分からマップ外への離脱を行うことはなく、また敵が命乞いなどをしたとしても必ず惨たらしく皆殺しにしようとする。【精神力】を１消費すれば、この衝動を克服できる（モブ多数の場合はまとめて1個とみなしてよい）。アーチ級ソウル憑依者の場合は【精神力】を１ではなく２消費する必要がある。"
rands = [
  { sides = 6, value = 3 },
]

