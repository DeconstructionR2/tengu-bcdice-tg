# ============================================================================
# T1.3 追加：NSRS 発狂命令族（NSRS / NSRS_A~D）+ 天狗呈现版 SBX / WSX
#
# 生成方式（实绩）：output/success/failure 由一次性脚本从真实 eval 机械采集
#   （runner 逐字断言，手抄必红；该脚本未入库——kimi T1.3 评审 P2 已记录）。
#   语义锚点独立成立：表文本逐字来自 i18n yml（字节级对齐天狗源），+1 偏移
#   边界用例（NSRS_C 出目2/7）由骰型规格独立推导。
#   通用 toml 用例生成器将于 T1.4 入库（scripts/gen_table_toml.rb）。
#
# 语义要点：
#   - NSRS = 忠实天狗**纯表查询**（用户 2026-10-11 拍板）：无前置 NRS 克服判定，
#     只有 1D3/1D6/1D6+1/1D3+1 四骰型选表；裸 NSRS == NSRS_A。
#   - +1 骰型（C/D）出目含補正，按表级 min_index=1 直接索引 items[sum-1]，
#     **不存在每骰型偏移**（kimi-code T1.1 评审 P1 教训）。
#     C 的最小/最大出目 2/7 与 D 的 2/4 各有专门用例守边界。
#   - SBX / WSX 为天狗呈现版（含加粗效果摘要）；父类 SB@x / WSE@x 纯文本版
#     原样并存（拍板 D1-A1=B），末尾孪生对照用例守住父类行为零改动。
#   - 异常系：未知枝 NSRS_X / NSRS_E、未知表 NSRX、SBX@3 均不响应（output 空串）。
# ============================================================================

# NSRS発狂(A/1D3)
[[ test ]]
game_system = "NinjaSlayer2Ex"
input = "NSRS_A"
output = "nsrs発狂(1D3) ＞ (3) ＞ **パニック逃走や異常行動**：\n恐怖のあまり絶叫し、仲間を見捨ててその場から全速力で逃げ出そうとしたり、闇雲にスリケンやジツを乱射しようとする。\nひどい状態になると、仲間のことをニンジャスレイヤーの変装や協力者だと思い込んで攻撃を仕掛けたり、理解不能な異常行動を取ったりする。\n\n探索シーケンスの場合、直ちに戦闘シーケンスが発生してこのPCの手番となり、1ターンだけマスターがこのPCを操作する。\nこのPCは常軌を逸した身体能力を発揮し、【脚力】6として行動する。\nマスターはこのPCに自傷行為以外のどんな行動を取らせてもよい。\nこのPCにとっては、あらゆるキャラが敵とみなされる。\nこのターンの終了時に、このPCは正気に戻る。\n戦闘中の場合も同様で、次の手番にこの状態となる。\n手番開始時に攻撃できる相手がニンジャスレイヤーしか見えていない場合、逃走を優先する。\n"
rands = [
  { sides = 3, value = 3 },
]

