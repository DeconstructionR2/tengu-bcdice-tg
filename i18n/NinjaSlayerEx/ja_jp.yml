          特定のジンクスやブツメツなどを気にする昔気質の伝統主義者や敬虔なブッダ信奉者、あるいはアンタイブディスト（反ブッダ主義者）などであろう。このPCはシナリオ開始時ごとにD6を振り、偶数なら【精神力】が+1、奇数なら【精神力】が-1される（これにより【精神力】が0未満になる場合は、代わりに【体力】を-1する）。この修正はそのシナリオの間のみ有効。
