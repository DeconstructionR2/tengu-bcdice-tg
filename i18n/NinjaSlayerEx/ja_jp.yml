      SOUL:
        name: 'ソウル鑑定_1(1D6) ＞ '
        type: 1D6
        items:
        - |-
          **レッサー級ニンジャソウル**：このニンジャは今後いかなる方法を用いても素の【ジツ】値を４以上にはできない。
          【ジツ】値３（拡張サイバネの修を含まない素の値）の状態で『カルマロンダリング』を行い「レッサー級ソウル」と判定されてしまった場合、【ジツ】値を１上げる代わりに他の任意の能力値を２上げる（壁に到達しているならばそれを突破する）か、◉を２個獲得するか、もしくは能力値と◉を１ずつ得る。
          【ジツ】値０の状態でこの『カルマロンダリング』を行い、敢えて【ジツ】値０のレッサーとして生き続けることを選んだ場合、今回の【ジツ】値１上昇も起こらず、代わりに『アーチ級ルール導入時のレッサー級のメリット』を得る。

          **プラグイン環境でのレッサー級のメリット**：レッサー級ニンジャソウル憑依者は、通常のニンジャであれば【ジツ】値を得るようなタイミングで、代わりに◉スキルを得ることができ。また現在の◉スキル個数が２個以下の場合のみ、「*マキモノ・オブ・シークレット・ニンジャアーツ*」を使うことで、ジツの代わりに◉スキルを習得することができる。

          **アーチ級ルール導入時のレッサー級のメリット**：レッサー級ニンジャソウル憑依者と判明し、かつ【ジツ】値０として生きることを選んだPCは、その時点から◉スキルの最大基本スキルスロットが６個ではなく７個となる。加えて、能力値上限へのペナルティを調べたり、スキル習得コストを調べるために現在の所有◉スキル総数を数えるうえで、本来よりも１個少ない個数とみなすことができる（マキモノの使用時も含む）。なお、これはソウル鑑定ルールを導入し、かつアーチ級のPCが存在しうるようなキャンペグン環境で、各ソウル憑依者ごとの役割分担や特徴づけを可能な限り維持するためのルールだ。アーチ級憑依者のPCを許可しない環境ならば、このルールは使用しないほうが良いだろう（その場合は単純に一時的に◉スキルを１個減らせばよい）。
