ja_jp:
  NinjaSlayerEx:
    table:
      WS:
        name: 'wasshoiエントリー_1(1D6) ＞ '
        type: 1D6
        items:
        - "**高所からの回転着地！タタミ四枚の距離で睨み合った！**：標的ニンジャから３または４マス離れた任意の場所に【殺】コマを置くこと。"
        - "**ドアを蹴破って出現！**：そのマップの任意のドアの隣に【殺】コマを置くこと。マップ外に繋がるドアならばどれを選んでも良い。またマップ内の別部屋につながるドアの場合でも、他のPCがいない部屋からの出現になるならば、どこを選んでも良い。なお、ドアにあらかじめ鍵をかけるなどの行為は全て無駄である。"
        - "**天井破壊または垂直リフト射出により出現！**：標的ニンジャから２マス離れた任意の場所に【殺】コマを置くこと。"
        - "**冷蔵庫や金庫から突如出現！**：そのマップ上に存在するトレジャーボックスの中に、ニンジャスレイヤーが潜んでいた。標的ニンジャから最も近いトレジャーボックス１個の隣に【殺】コマを置くこと。"
        - "**KRAAAAASH！ 窓を突き破り出現！**：標的ニンジャから最も近い窓の隣に【殺】コマを置くこと。窓がマップにない場合は「２：ドアを蹴破って出現」になる。"
        - "**「行き先はジゴクですよ」**：マップ上にいるモータル１人（標的ニンジャから最も近くにいる者）が、実はニンジャスレイヤーの変装であった。そのモータルのコマを【殺】に変更せよ。驚きのあまり、標的ニンジャは次の手番に『ウカツ！』状態となる。"
      JITSB:
        name: 'ジツ拡張サイバネ暴走_1(1D6) ＞ '
        type: 1D6
        items:
        - "**「ナムアミダブツ！」：**サイバネ回路が異常暴走し、術者のニューロンを焼く。術者はサイバネから火花を散らして叫び、おびただしい鼻血を垂らしたり血の涙を流して、直ちに【精神力】に1ダメージを受ける。"
        - "**「ナムアミダブツ！」：**サイバネ回路が異常暴走し、術者のニューロンを焼く。術者はサイバネから火花を散らして叫び、おびただしい鼻血を垂らしたり血の涙を流して、直ちに【精神力】に1ダメージを受ける。"
        - "**「ナムアミダブツ！」：**サイバネ回路が異常暴走し、術者のニューロンを焼く。術者はサイバネから火花を散らして叫び、おびただしい鼻血を垂らしたり血の涙を流して、直ちに【精神力】に1ダメージを受ける。"
        - |-
          **「アイエエエエエエ！」：**オヒガンの奥底に眠るカツ・ワンソーの凝視を引き寄せ、術者のニンジャソウルが悲鳴をあげる（無論、ほとんどのニンジャにとっては何が起こっているのか理解できず、一時的な恐慌状態に陥るのみだ）。
          **術者は「ナムアミダブツ！」の効果（直ちに【精神力】に1ダメージを受ける）に加え、同じジツをこのシナリオ内で再使用するには、暴走事故の恐怖を克服するために本来よりも【精神力】を１多く支払わねばならなくなる（この効果は累積する）。**
        - |-
          **「アイエエエエエエ！」：**オヒガンの奥底に眠るカツ・ワンソーの凝視を引き寄せ、術者のニンジャソウルが悲鳴をあげる（無論、ほとんどのニンジャにとっては何が起こっているのか理解できず、一時的な恐慌状態に陥るのみだ）。
          **術者は「ナムアミダブツ！」の効果（直ちに【精神力】に1ダメージを受ける）に加え、同じジツをこのシナリオ内で再使用するには、暴走事故の恐怖を克服するために本来よりも【精神力】を１多く支払わねばならなくなる（この効果は累積する）。**
        - |-
          **「バカナ！ こんな、こんなはずでは……！」：**制御不能となったジツが暴発する！　術者は「ナムアミダブツ！」の効果（直ちに【精神力】に1ダメージ）を受ける。
          **そのジツが直ちにダメージを与えるようなものだった場合、そのダメージは全て＋１されるが、本来は味方を巻き込まないはずのジツであったとしても、味方を巻き込んでしまう（範囲ではなく敵単体をターゲットにするようなジツだった場合は、その敵に隣接する不運な味方がいた場合、その味方にも同じ効果が与えられてしまう。そのような味方が複数いる場合は１人をランダムに選択する）。**
          それがムテキやヘンゲなど自分をターゲットにするジツだった場合は、術者は「ナムアミダブツ！」の効果に加え、【体力】に対して直ちに回避不能のD3ダメージを受けるが、効果が本来よりも１ターン長く継続する。特殊なジツの場合は、NMがこのどちらにするか決めること。
        - |-
          **「バカナ！ こんな、こんなはずでは……！」：**制御不能となったジツが暴発する！　術者は「ナムアミダブツ！」の効果（直ちに【精神力】に1ダメージ）を受ける。
          **そのジツが直ちにダメージを与えるようなものだった場合、そのダメージは全て＋１されるが、本来は味方を巻き込まないはずのジツであったとしても、味方を巻き込んでしまう（範囲ではなく敵単体をターゲットにするようなジツだった場合は、その敵に隣接する不運な味方がいた場合、その味方にも同じ効果が与えられてしまう。そのような味方が複数いる場合は１人をランダムに選択する）。**
          それがムテキやヘンゲなど自分をターゲットにするジツだった場合は、術者は「ナムアミダブツ！」の効果に加え、【体力】に対して直ちに回避不能のD3ダメージを受けるが、効果が本来よりも１ターン長く継続する。特殊なジツの場合は、NMがこのどちらにするか決めること。
      DKKI:
        name: '暗黒カラテ衝動_1(1D6) ＞ '
        type: 1D6
        items:
        - |-
          **破壊衝動：**
          このニンジャは残虐な暴力衝動や殺戮衝動に呑まれやすくなったり、思考回路から人間性が失われてゆく。シナリオ内で【DKK】を獲得できるようなシチュエーションが目の前にある場合、可能な限りそれを得るような行動を取らねばならない。行動を強いられたくない場合、【精神力】を１消費すれば、このマップにいる間だけこの衝動を克服する。アーチ級ソウル憑依者の場合は【精神力】を１ではなく２消費する必要がある。
        - |-
          **非ニンジャのクズめが！：**
          モータルなど脆弱な虫ケラにすぎず、そのような者に自分が傷つけられるはずはない。種別に『モータル』を持つ敵に対しての攻撃および回避時に、【精神力】を使用できなくなる。アーチ級ソウル憑依者の場合は、種別『戦闘兵器』も対象となる。
        - |-
          **徹底抗戦：**
          極めて傲慢かつ自尊心が高いため、自分を挑発したり傷つけてきた敵の存在を許さない。たとえそれがネオサイタマの死神であろうとも。ダメージを受けたかどうかに関わらず敵から攻撃を受けた場合、ないしは露骨な挑発や侮辱を受けた場合、その敵が死ぬまで自分からマップ外への離脱を行うことはなく、また敵が命乞いなどをしたとしても必ず惨たらしく皆殺しにしようとする。【精神力】を１消費すれば、この衝動を克服できる（モブ多数の場合はまとめて1個とみなしてよい）。アーチ級ソウル憑依者の場合は【精神力】を１ではなく２消費する必要がある。
        - |-
          **自我干渉：**
          本来は憑依と同時に消滅するはずであったソウルの記憶断片や声や自我のごく一部が、憑依者の精神に対してノイズのように残留してフラッシュバックを起こし、判断力や身体制御を狂わせる。このニンジャは「【精神力】−１」もしくは「回避ダイス−１個、近接攻撃ダイス−１個、遠隔攻撃ダイス−１個」どちらかの効果を受ける（取得時にどちらかを宣言し、取得後は変えられない）。アーチ級ソウル憑依者の場合はこれを両方、もしくは、どちらかの効果を２倍得る（取得時に宣言し、取得後は変えられない）。
        - |-
          **ソウルの悲鳴：**
          ニンジャスレイヤーおよび妖刀ベッピンを持つダークニンジャと戦闘に入った場合、ソウルそのものが堪え難い恐怖を覚え、浮き足立ち、震え上がる（憑依者自身はその理由を明確には理解できないだろう）。これらの敵からこのPCに対する『近接攻撃』と『遠隔攻撃』は全て『ウカツ！』状態に対する攻撃とみなされて難易度が−１される。加えて、このPCがこれらの敵に対して行う『近接攻撃』および『遠隔攻撃』は、全て難易度が＋１される。【精神力】２を消費すれば、そのシナリオ中のみこの衝動を克服する。アーチ級ソウル憑依者の場合は【精神力】を２ではなく４消費する必要がある。
        - |-
          **ソウルの悲鳴：**
          ニンジャスレイヤーおよび妖刀ベッピンを持つダークニンジャと戦闘に入った場合、ソウルそのものが堪え難い恐怖を覚え、浮き足立ち、震え上がる（憑依者自身はその理由を明確には理解できないだろう）。これらの敵からこのPCに対する『近接攻撃』と『遠隔攻撃』は全て『ウカツ！』状態に対する攻撃とみなされて難易度が−１される。加えて、このPCがこれらの敵に対して行う『近接攻撃』および『遠隔攻撃』は、全て難易度が＋１される。【精神力】２を消費すれば、そのシナリオ中のみこの衝動を克服する。アーチ級ソウル憑依者の場合は【精神力】を２ではなく４消費する必要がある。
      KRM:
        name: 'カルマロンダリング_1(1D6) ＞ '
        type: 1D6
        items:
        - |-
          **『痴れ者めが！』：**
          君の行いは、裏社会の掟や規律までも乱しかねないほど残虐で無軌道であったため、ラオモトの耳にも入っている。狂犬を躾もせず野放しにしていては、ソウカイヤのビジネスに悪影響が出るだろう。
          **このPCはケジメを強いられて【名声：ソウカイヤ】が−3され、さらに『ニンジャソウルの闇』を獲得してしまう。通算で３回『痴れ者めが！』を出してしまった場合、そのPCは突如現れたダークニンジャにより抹殺される（キャラロスト）。**
        - |-
          **『ブレイコウも大概にせよ』：**
          ソウカイヤは快楽殺人者の集団ではない。ヤクザとしての強暴性は讃えられるが、無力なモータルの拷問や虐殺を重ねていきがっているようなサンシタに未来はなかろう。
          **このPCの【名声：ソウカイヤ】は-１される。**
        - |-
          **『面白い奴だ、これでサケでも飲むがいい！』：**
          ラオモトは懐から無造作に万札束を取り出し、君に放り投げる。
          **このPCは【万札】10を得る。**
        - |-
          **『面白い奴だ、これでサケでも飲むがいい！』：**
          ラオモトは懐から無造作に万札束を取り出し、君に放り投げる。
          **このPCは【万札】10を得る。**
        - |-
          **『ムハハハハ！　よいぞ、貴様の無慈悲さはワシを楽しませてくれる！』：**
          君はラオモトから一目置かれる存在となった。
          **このPCの【名声：ソウカイヤ】は＋１される。**
        - |-
          **『どれ、ワシがひとつ稽古をつけてやろう』：**
          君は今すぐラオモトと１対１でタタミの上で戦うことが許される（実際に戦闘すること）。
          **ラオモトとの戦闘終了後、このPCの【名声：ソウカイヤ】は＋１され、さらに【カラテ】/【ニューロン】/【ワザマエ】のいずれかを１上昇させされる。その能力値が６だった場合、『成長の壁（１）』を取り除き７となる。なお、この戦闘時は、双方ともに爆発四散も『サツバツ！』も発生せず、『サツバツ！』が決まった瞬間に戦闘終了となる。ラオモトに対して『サツバツ！』を決めた場合、腕を見込まれ【名声】が＋D３される。**
        - |-
          **『ムッハハハハハハ！　お前には華がある！　これでさらに磨いておけ！』：**
          ラオモトは懐から無造作に万札束を取り出し、君に放り投げる。
          **このPCの【名声：ソウカイヤ】は＋１され、さらに【万札】30を得る。**
        - |-
          **『見事な働きであった。お前はこれで、ヤクザの品格も学んでくるがいい』：**
          ラオモトがぽんぽんと手を叩くと、控えていた金髪オイランたちが「オキナワ旅行」と書かれた大型のボードを高々と掲げ、君に手渡す。
          **このPCの【名声：ソウカイヤ】は＋２され、さらにオキナワ旅券を１枚獲得する（【万札】10で売却してもよい）。**
        - |-
          **『いい面構えをしている。ヤクザの目だ』：**
          死線を乗り越え、人間性を捨ててゆく中で、君はいつしか元モータルとしての壁を超えていた。
          **このPCの【名声：ソウカイヤ】は＋１され、さらに【カラテ】/【ニューロン】/【ワザマエ】のいずれかを１成長させされる。その能力値が６だった場合、『成長の壁（１）』を取り除き７となる。**
        - |-
          **『ムハハハハハハ！　面白い！　貴様の無慈悲さはまるでカタナのようだ！』：**
          ボスは君の働きぶりにご満悦だ。
          **このPCは【名声：ソウカイヤ】＋２、または【万札】50を得る（どちらか好きな方を選べる）。さらにD6を振り、出目が1-3ならば『ニンジャソウルの闇』までも得てしまう。**
        - |-
          **『アッパレ！　好きな褒美を取らせよう！』：**
          今夜のラオモトは特に機嫌が良いようだ。
          **このPCの【名声：ソウカイヤ】は＋２される。さらに「NINJA SLAYER RPGプラグイン：リボルバー・アンド・ヌンチャク」から、レア度「*」かつ【万札】50までのアイテムを１個獲得できる（プラグインを導入していない場合は「キーボード・オブ・ゴールデン・エイジ」「マキモノ・オブ・シークレット・ニンジャアーツ」「ボンサイ・オブ・ダークネス」から選択すること）。**
        - |-
          **『リー先生のラボへ行け。お前のニンジャソウルを確かめる必要がある』：**
          ラオモト・カンはただならぬニンジャ存在感を感じ取った。もしかすると、君に憑依していたのは単なるレッサーニンジャソウルなどではなく、グレーター、あるいはアーチ級ソウルだったのかもしれない。正体が明かされるかどうかは不明だが、少なくとも、溢れ出すそのキリングオーラは周囲のソウカイニンジャたちから高いソンケイを勝ち取るだろう。
          **このPCの【ジツ】値が１上昇し、【名声：ソウカイヤ】が＋３される。また『NINJA SLAYER RPGプラグイン：ウェイ・オブ・ザ・リアルニンジャ』の表を使い、憑依ニンジャソウルの格と種類を鑑定すること（プラグインを導入しない場合、およびすでにこの結果を一度得ている場合は無視する）。**
      CYBER:
        name: 'サイバネ狂気判定_1(2D6) ＞ '
        type: 2D6
        items:
        - |-
          **サイバネティクスへの狂信**
          **１段階目（重篤）：**余暇ごとに可能な限りサイバネ手術を行い、最低でも１個は組み込み総数を増やすようにしなければならない。能力値の上限に達し、それ以上の組み込みができない場合は、▷系のパーツを新たなものに換装しようとしなければならない。【万札】が不足している場合、ローンしてでも新たなものを組み込んだり換装しようとしたりする。これらの衝動を満たせなかった場合、極度のフラストレーションにより、次のシナリオは【体力】-１、【精神力】-１でスタートしなければならず、また旅行などによるリラクゼーション効果も得られない。加えて、シナリオ中にサイバネを破壊された場合、追加で【精神力】へのダメージを１受ける。
          **２段階目：**なし。同じ目が出たらダイスを振り直す。
        - |-
          **LAN直結衝動**
          **１段階目（重篤）：**非戦闘時、直結可能な端子を見たら、どれだけ危険でも迷わずLAN直結してしまう（非戦闘時はケーブル装備必要なし）。それがハッキング可能なものだった場合、ハッキングを必ず試みなければならならない。生体LANを持つNPCに対してもこれが起こりうる（NM判断によりLAN直結戦闘が開始してしまう）。一度ハッキングや直結戦闘を行えば、その対象については満足を覚える。この衝動が起こるかどうかは常にNMが判断する。この衝動を振り切りたい場合は【精神力】を１消費しなければならない。
          **２段階目：**なし。同じ目が出たらダイスを振り直す。
        - |-
          **獣化/黒い復讐心**
          **１段階目（中等度）：**戦闘中に１ダメージでも受けた場合、次の手番からその相手（敵味方問わず）に対して可能な限り接近し、近接攻撃を仕掛けなければならない（近接攻撃が届かなければ移動後に射撃やジツを使ってもよい。**行動優先度は「非移動の攻撃集中」＞「接近のための移動ののち近接攻撃」＞「接近のための移動ののちジツや遠隔武器による攻撃」となる）**。また、この敵に対する近接攻撃ダイスは＋１個される。別な敵から新たなダメージを受けた場合、攻撃目標をこの新たな相手に切り替えてもよい。この効果は戦闘が終了するか、その敵が戦闘不能になるか、あるいは自分の手番の開始時に【精神力】を１消費してこの衝動を振り払うまで持続する。
          **２段階目（重篤）：**上記に加え、火に対して原初的な恐怖を抱き始める。火炎や爆発による１以上のダメージを受けた場合、追加で【精神力】にもダメージ１を受ける。
          **３段階目：**なし。同じ目が出たらダイスを振り直す。
        - |-
          **自我希薄化**
          **１段階目（軽度）：**自発的行動での『精神力成功』に必要な【精神力】が１増加する。
          **２段階目（中等度）：**自発的行動での『精神力成功』に必要な【精神力】が２増加する。また【精神力】が−１される。
          **３段階目（重篤）：**自発的行動での『精神力成功』が不可能となる。また【精神力】が−２される。
        - |-
          **虚無衝動/強化肉体への過信**
          **１段階目（軽度）：**回避判定での『精神力成功』に必要な【精神力】が１増加する。
          **２段階目（中等度）：**回避判定での『精神力成功』に必要な【精神力】が２増加する。『サツバツ！』に対する回避の『精神力成功』が不可能になる。
          **３段階目（重篤）：**あらゆる回避判定での『精神力成功』が不可能となる。
        - |-
          **狂戦士化/過剰戦闘衝動**
          **１段階目（軽度）：**戦闘中に近接攻撃によって1ダメージでも受けるか与えた場合、その戦闘が終わるまで【カラテ】判定のダイスが２個増え、回避ダイスが２個減る。
          **２段階目（中等度）：**戦闘中に近接攻撃によって1ダメージでも受けるか与えた場合、その戦闘が終わるまで【カラテ】判定のダイスが４個増え、回避ダイスが４個減る。
          **３段階目（重度）：**戦闘中に近接攻撃によって1ダメージでも受けるか与えた場合、その戦闘が終わるまで【カラテ】判定のダイスが６個増え、回避ダイスが６個減る。
        - |-
          **薬物依存/バイオインゴット欠乏症**
          **１段階目（軽度）：**消費アイテムによる【体力】および【精神力】の回復量が−１される（最低値は回復量０）。ZBR蘇生は例外。
          **２段階目（中等度）：**消費アイテムによる【体力】および【精神力】の回復量が−２される（最低値は回復量０）。ZBR蘇生は例外。また【精神力】が−１される。
          **３段階目（重篤）：**消費アイテムによる【体力】および【精神力】の回復量が−３される（最低値は回復量０）。ZBR蘇生は例外。また【精神力】が−２される。
        - |-
          **神経ノイズ/電子幻覚**
          **１段階目（軽度）：**このニンジャは【ワザマエ】−１の永続的ペナルティを受ける。また回避ダイスが−１個される。
          **２段階目（中等度）：**このニンジャは【ワザマエ】−２の永続的ペナルティを受ける。また回避ダイスが−２個される。
          **３段階目（重篤）：**このニンジャは【ワザマエ】−３の永続的ペナルティを受ける。また回避ダイスが−３個される。
        - |-
          **残存記憶のゴースト**
          **１段階目（軽度）：**アトモスフィアがハード化した場合、回避ダイスが−１個され、以降戦闘終了まで１ターンごとに−１個ずつ増えてゆく。
          **２段階目（中等度）：**アトモスフィアがハード化した場合、回避ダイスが−２個され、以降戦闘終了まで１ターンごとに−２個ずつ増えてゆく。また【精神力】が−１される。
          **３段階目（重篤）：**アトモスフィアがハード化した場合、回避ダイスが−３個され、以降戦闘終了まで１ターンごとに−３個ずつ増えてゆく。また【精神力】が−２される。
        - |-
          **自我崩壊/精神崩壊**
          **１段階目（軽度）：**このニンジャは【ニューロン】−１の永続的ペナルティを受ける。
          **２段階目（中等度）：**このニンジャは【ニューロン】−２の永続的ペナルティを受ける。
          **３段階目（重篤）：**このニンジャは【ニューロン】−４の永続的ペナルティを受ける。
        - |-
          **狂気の中の真実**
          **１段階目（軽度）：**『●不屈の精神』を自動取得する（◉として持っている場合は代わりに【精神力】が＋１される）。
          **２段階目（中等度）：**１段階目に加え【精神力】が＋２される。【ニューロン】判定時にダイス＋２個。
          **３段階目（重篤）：**１段階目に加え【精神力】が＋３される。【ニューロン】判定時にダイス＋３個。
